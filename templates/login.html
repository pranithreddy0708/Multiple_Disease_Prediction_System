<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DiseasePred</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* Center container */
        
        .login-container {
            width: 380px;
            margin: 120px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
        /* Title */
        
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3a5f;
        }
        /* Input fields */
        
        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        /* Button */
        
        .login-container button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .login-container button:hover {
            background: #1d4ed8;
        }
        /* register link */
        
        .login-container p {
            text-align: center;
            margin-top: 15px;
        }
        
        .login-container a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        <form method="POST">

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required> {% if error %}
            <p style="color:red; margin-top:5px;">{{ error }}</p>
            {% endif %}


            <button type="submit">Login</button>


        </form>

        <p>Don't have account? <a href="/register">Register</a></p>

    </div>

</body>

</html>
